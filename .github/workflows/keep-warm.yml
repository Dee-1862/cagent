# Keeps the free Render service awake. Render sleeps it after about 15 minutes idle and the
# first visitor then waits about a minute. /health is cheap: it uses no Cartesia, Moss or Elastic.
# Scheduled workflows only run from the default branch, so this starts once it is merged to master.
name: Keep Render warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the hub health check
        env:
          HUB_URL: ${{ vars.UNSTEP_PUBLIC_URL || 'https://unstep.onrender.com' }}
        run: curl -fsS --retry 5 --retry-delay 20 --retry-all-errors --max-time 60 "$HUB_URL/health"
